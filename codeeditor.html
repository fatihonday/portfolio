<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Mini HTML Editör - Horizontal Tree Schema & Smart Console</title>

<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="manifest" href="site.webmanifest">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/theme/dracula.min.css">

<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display:flex; flex-direction:column; height:100vh; background:#f5f5f5; color:#222; transition: background 0.2s, color 0.2s; }
  body.dark { background:#1e1e1e; color:#ccc; }

  /* --- TOOLBAR (32px) --- */
  #topBar {
    height: 32px;
    background: #e8e8e8;
    border-bottom: 1px solid #ccc;
    padding: 0 8px;
    display: flex;
    align-items: center;
    gap: 4px;
    z-index: 10;
    font-size: 12px;
    user-select: none;
  }
  body.dark #topBar { background: #252526; border-color: #383838; }

  .logo-link { display: flex; align-items: center; margin-right: 4px; }
  .logo-link img { height: 20px; width: auto; cursor: pointer; display: block; }

  .email-link {
    margin-left: auto;
    font-size: 11px;
    color: #555;
    text-decoration: none;
    padding: 2px 6px;
    border-radius: 2px;
  }
  body.dark .email-link { color: #aaa; }
  .email-link:hover { text-decoration: underline; color: #007acc; }

  .btn-plain {
    background: transparent;
    border: none;
    color: #333;
    padding: 2px 8px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    white-space: nowrap;
    height: 22px;
    display: inline-flex;
    align-items: center;
  }
  body.dark .btn-plain { color: #cccccc; }
  .btn-plain:hover { background: #dcdcdc; }
  body.dark .btn-plain:hover { background: #37373d; }
  .btn-plain.active { background: #d0d0d0; font-weight: 600; }
  body.dark .btn-plain.active { background: #3e3e42; color: #fff; }

  .project-name-btn {
    font-size: 11px;
    color: #007acc;
    background: rgba(0,122,204,0.08);
    border: 1px solid rgba(0,122,204,0.2);
    padding: 2px 8px;
    border-radius: 2px;
    cursor: pointer;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-weight: 600;
    height: 22px;
  }
  body.dark .project-name-btn { color: #75beff; background: rgba(117,190,255,0.08); border-color: rgba(117,190,255,0.2); }
  .project-name-btn:hover { background: rgba(0,122,204,0.15); }

  .v-divider { width: 1px; height: 14px; background: #ccc; margin: 0 2px; }
  body.dark .v-divider { background: #444; }

  /* --- ANA DÜZEN --- */
  #mainContainer {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 32px);
    overflow: hidden;
    position: relative;
  }

  #workspaceWrapper {
    flex: 1;
    display: flex;
    height: 100%;
    overflow: hidden;
  }

  /* Sol Yan Barlar */
  .sidebar-panel {
    width: 240px;
    background: #f0f0f0;
    border-right: 1px solid #ccc;
    display: none;
    flex-direction: column;
    z-index: 5;
    user-select: none;
  }
  body.dark .sidebar-panel { background: #252526; border-color: #383838; }

  .sidebar-header {
    padding: 8px 10px;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #666;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  body.dark .sidebar-header { color: #888; border-color: #333; }

  .tool-item {
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    border-bottom: 1px solid #eaebec;
    background: transparent;
    border-left: none; border-right: none; border-top: none;
    text-align: left;
    color: inherit;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  body.dark .tool-item { border-color: #2a2a2b; color: #ccc; }
  .tool-item:hover { background: #e0e0e0; }
  body.dark .tool-item:hover { background: #2a2d2e; }

  #projectList { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
  #projectList li {
    padding: 7px 10px; font-size: 12px; cursor: pointer; border-bottom: 1px solid #eaebec;
    display: flex; justify-content: space-between; align-items: center;
  }
  body.dark #projectList li { border-color: #2a2a2b; }
  #projectList li:hover { background: #e0e0e0; }
  body.dark #projectList li:hover { background: #2a2d2e; }
  #projectList li.selected { background: #d4d4d4; font-weight: 600; }
  body.dark #projectList li.selected { background: #37373d; color: #fff; }
  #projectList li .del-proj { opacity: 0; color: #e74c3c; border: none; background: none; cursor: pointer; font-size: 11px; }
  #projectList li:hover .del-proj { opacity: 1; }

  /* MİMARİ DOSYA AĞACI VE BUTONLAR */
  .tree-toolbar {
    display: flex;
    gap: 2px;
    padding: 6px 8px;
    border-bottom: 1px solid #ddd;
    background: rgba(0,0,0,0.02);
  }
  body.dark .tree-toolbar { border-color: #333; background: rgba(255,255,255,0.02); }

  .tree-btn {
    font-size: 10px;
    padding: 2px 5px;
    border: 1px solid #ccc;
    background: #fff;
    border-radius: 2px;
    cursor: pointer;
    color: #333;
    white-space: nowrap;
  }
  body.dark .tree-btn { background: #2d2d2d; border-color: #444; color: #ccc; }
  .tree-btn:hover { background: #e0e0e0; }
  body.dark .tree-btn:hover { background: #383838; }

  #fileTreeContainer { flex: 1; overflow-y: auto; padding: 4px 0; }
  .tree-node { font-size: 11px; font-family: monospace; user-select: none; }
  .tree-row { display: flex; align-items: center; justify-content: space-between; padding: 3px 8px; cursor: pointer; color: #444; }
  body.dark .tree-row { color: #bbb; }
  .tree-row:hover { background: #e0e0e0; }
  body.dark .tree-row:hover { background: #2a2d2e; }
  .tree-row.active { font-weight: bold; color: #007acc; background: rgba(0,122,204,0.1); }
  body.dark .tree-row.active { color: #75beff; background: rgba(117,190,255,0.1); }
  .tree-row .node-actions { opacity: 0; display: flex; gap: 4px; }
  .tree-row:hover .node-actions { opacity: 1; }
  .node-btn { background: none; border: none; font-size: 10px; color: #888; cursor: pointer; padding: 0 2px; }
  .node-btn:hover { color: #e74c3c; }
  .tree-children { padding-left: 14px; }

  #activeProjectFiles { display: flex; flex-direction: column; gap: 4px; padding: 4px 10px; max-height: 90px; overflow-y: auto; }
  .file-chip { display: flex; align-items: center; justify-content: space-between; background: #fff; border: 1px solid #ccc; padding: 2px 6px; border-radius: 2px; font-size: 11px; }
  body.dark .file-chip { background: #2d2d2d; border-color: #444; color: #eee; }
  .file-chip .del-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 10px; }
  .file-chip .del-btn:hover { color: #e74c3c; }

  #dropZone { border: 1px dashed #aaa; border-radius: 2px; padding: 6px; font-size: 11px; color: #666; background: transparent; cursor: pointer; margin: 6px 10px; text-align: center; }
  body.dark #dropZone { color: #aaa; border-color: #555; }
  #dropZone.dragover { border-color: #27ae60; color: #27ae60; }

  /* WorkSpace & Dosya Sekmeleri (Tabs) */
  #mainWorkspace { flex: 1; display: flex; height: 100%; overflow: hidden; }
  #editor { flex: 1; height: 100%; display: flex; flex-direction: column; border-right: 1px solid #ccc; }
  body.dark #editor { border-color: #383838; }

  #editorTabs { height: 28px; background: #e1e1e1; border-bottom: 1px solid #ccc; display: flex; align-items: center; padding-left: 4px; user-select: none; overflow-x: auto; }
  body.dark #editorTabs { background: #2d2d2d; border-color: #383838; }

  .tab-item { height: 28px; padding: 0 10px; font-size: 11px; font-family: monospace; display: flex; align-items: center; gap: 6px; background: #d8d8d8; border-right: 1px solid #ccc; color: #555; cursor: pointer; white-space: nowrap; }
  body.dark .tab-item { background: #252526; border-color: #383838; color: #888; }
  .tab-item.active { background: #f5f5f5; color: #000; font-weight: bold; border-bottom: 2px solid #007acc; }
  body.dark .tab-item.active { background: #1e1e1e; color: #fff; border-bottom-color: #75beff; }
  .tab-close { font-size: 10px; border-radius: 50%; padding: 0 3px; color: #888; }
  .tab-close:hover { background: rgba(0,0,0,0.1); color: #e74c3c; }

  #preview { width: 50%; height: 100%; border: none; background: #fff; }
  .CodeMirror { flex: 1; height: auto; font-size: 13px; }

  /* --- ALT KONSOL BARİ (CONSOLE BAR) --- */
  #consoleBar {
    height: 160px;
    background: #1e1e1e;
    color: #ddd;
    border-top: 1px solid #333;
    display: none;
    flex-direction: column;
    font-family: monospace;
    font-size: 11px;
    z-index: 20;
    transition: height 0.2s ease-in-out;
  }

  /* DARALTILDIĞINDA SADECE SON SATIR DÜZENİ (~54px) */
  #consoleBar.minimized {
    height: 54px !important;
  }
  #consoleBar.minimized #consoleInputArea {
    display: none !important;
  }
  #consoleBar.minimized #consoleLogs {
    padding: 2px 6px;
    overflow: hidden;
  }
  #consoleBar.minimized #consoleLogs .log-line {
    display: none;
  }
  #consoleBar.minimized #consoleLogs .log-line:last-child {
    display: flex !important;
  }

  .console-header {
    height: 28px;
    background: #252526;
    padding: 0 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #333;
    user-select: none;
  }
  .console-header-title { font-weight: bold; color: #aaa; font-size: 11px; }

  .console-btn-icon {
    cursor: pointer;
    color: #aaa;
    font-size: 11px;
    padding: 2px 5px;
    border-radius: 2px;
  }
  .console-btn-icon:hover { color: #fff; background: rgba(255,255,255,0.1); }

  #consoleLogs { flex: 1; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 3px; }
  .log-line { display: flex; gap: 8px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom: 2px; }
  .log-time { color: #666; font-size: 10px; white-space: nowrap; }
  .log-msg { white-space: pre-wrap; word-break: break-all; }
  .log-info { color: #75beff; }
  .log-success { color: #4ec9b0; }
  .log-warn { color: #ce9178; }
  .log-error { color: #f48771; }

  #consoleInputArea { padding: 4px 8px; background: #2d2d2d; border-top: 1px solid #444; display: none; align-items: center; gap: 6px; }
  #consoleInputArea span { color: #4ec9b0; font-weight: bold; }
  #consoleInput { flex: 1; background: #1e1e1e; border: 1px solid #444; color: #fff; padding: 2px 6px; font-size: 11px; border-radius: 2px; outline: none; }
  #consoleInputBtn { background: #0e639c; color: #fff; border: none; padding: 3px 10px; font-size: 11px; cursor: pointer; border-radius: 2px; }
  #consoleInputBtn:hover { background: #1177bb; }

  /* Modal */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 100; }
  .modal-box { background: #fff; border-radius: 4px; width: 600px; max-width: 90%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
  body.dark .modal-box { background: #252526; color: #eee; border: 1px solid #444; }
  .modal-header { padding: 8px 12px; background: #e8e8e8; font-size: 12px; font-weight: bold; display: flex; justify-content: space-between; }
  body.dark .modal-header { background: #2d2d2d; }
  .modal-body { padding: 15px; display: flex; flex-direction: column; gap: 8px; max-height: 70vh; overflow-y: auto; }
  #notepadTextarea { width: 100%; height: 200px; padding: 8px; border: 1px solid #ccc; border-radius: 3px; font-family: monospace; font-size: 12px; resize: vertical; }
  body.dark #notepadTextarea { background: #1e1e1e; color: #eee; border-color: #444; }
  .modal-footer { padding: 8px 12px; text-align: right; background: #f5f5f5; }
  body.dark .modal-footer { background: #252526; }

  /* SOLDAN SAĞA AÇILAN İNTERAKTİF ŞEMA TUVALİ */
  #schemaCanvasContainer {
    position: relative;
    width: 100%;
    height: 520px;
    background: #fafafa;
    border: 1px solid #ccc;
    overflow: hidden;
    cursor: grab;
    user-select: none;
  }
  body.dark #schemaCanvasContainer { background: #181818; border-color: #383838; }
  #schemaCanvasContainer:active { cursor: grabbing; }

  #schemaViewport {
    position: absolute;
    top: 0; left: 0;
    transform-origin: 0 0;
  }

  .schema-reset-btn {
    position: absolute;
    top: 10px; right: 10px;
    z-index: 10;
    background: #fff; border: 1px solid #ccc;
    padding: 4px 8px; font-size: 11px; border-radius: 3px; cursor: pointer;
  }
  body.dark .schema-reset-btn { background: #2d2d2d; border-color: #444; color: #eee; }

  .block-node {
    position: absolute;
    width: 140px;
    height: 32px;
    background: #ffffff;
    border: 2px solid #007acc;
    border-radius: 4px;
    padding: 0 8px;
    font-size: 11px;
    font-weight: bold;
    font-family: monospace;
    color: #333;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  body.dark .block-node { background: #252526; color: #eee; border-color: #007acc; }

  .block-node.folder { border-color: #f39c12; background: #fffbf0; }
  body.dark .block-node.folder { background: #2a2415; border-color: #f39c12; }

  .block-node.root { border-color: #27ae60; background: #f0fff4; }
  body.dark .block-node.root { background: #132719; border-color: #27ae60; }

  svg.connections-layer {
    position: absolute;
    top: 0; left: 0;
    width: 5000px; height: 5000px;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="topBar">
  <a href="https://ondayelectronics.com" class="logo-link" title="ondayelectronics.com">
    <img id="siteLogo" src="ondayelectronicslogo2.png" alt="Onday Electronics Logo" onerror="this.style.display='none'">
  </a>

  <button class="btn-plain" id="projectsToggleBtn" onclick="toggleSidebar('projectsSidebar')">Projeler</button>
  
  <div class="v-divider"></div>

  <button class="project-name-btn" id="projectTitleDisplay" onclick="toggleSidebar('toolsSidebar')">Proje: Seçilmedi</button>

  <div class="v-divider"></div>

  <button class="btn-plain" onclick="document.getElementById('fileInput').click()">Dosya Aç</button>

  <div class="v-divider"></div>

  <button class="btn-plain" onclick="toggleDarkMode()">Tema</button>
  <button class="btn-plain" onclick="toggleEditor()">Kod Alanı</button>
  <button class="btn-plain" id="consoleToggleBtn" onclick="toggleConsoleBar()">Console</button>

  <a href="mailto:ondayfatih@gmail.com" class="email-link">ondayfatih@gmail.com</a>
</div>

<div id="mainContainer">

  <div id="workspaceWrapper">
    <div class="sidebar-panel" id="projectsSidebar">
      <div class="sidebar-header">
        <span>Kayıtlı Projeler</span>
        <span style="cursor:pointer;" onclick="closeSidebars()">✕</span>
      </div>
      <ul id="projectList"></ul>
    </div>

    <div class="sidebar-panel" id="toolsSidebar">
      <div class="sidebar-header">
        <span id="toolsHeaderTitle">Proje Araçları</span>
        <span style="cursor:pointer;" onclick="closeSidebars()">✕</span>
      </div>

      <button class="tool-item" onclick="saveProject()">Kaydet</button>
      <button class="tool-item" onclick="initSaveAsProject()">Farklı Kaydet</button>
      <button class="tool-item" onclick="runCode()">Çalıştır</button>
      <button class="tool-item" onclick="clearCode()">Temizle</button>
      <button class="tool-item" onclick="saveCode()">HTML İndir</button>
      <button class="tool-item" onclick="openNotepadModal()">Not Defteri</button>

      <div style="font-size:11px; font-weight:bold; padding:8px 10px 2px 10px; color:#888;">PROJE MİMARİSİ</div>
      <div class="tree-toolbar">
        <button class="tree-btn" onclick="promptCreateFile()">+ Dosya</button>
        <button class="tree-btn" onclick="promptCreateFolder()">+ Klasör</button>
        <button class="tree-btn" onclick="openSchemaModal()">📐 Şema</button>
      </div>

      <div id="fileTreeContainer"></div>

      <div style="font-size:11px; font-weight:bold; padding:6px 10px 2px 10px; color:#888;">VARLIKLAR (ASSETS)</div>
      <div id="activeProjectFiles"></div>

      <div id="dropZone" onclick="document.getElementById('fileUpload').click()">
        Dosya Bırak veya Seç
      </div>
    </div>

    <div id="mainWorkspace">
      <div id="editor">
        <div id="editorTabs"></div>
        <textarea id="code"></textarea>
      </div>
      <iframe id="preview"></iframe>
    </div>
  </div>

  <div id="consoleBar">
    <div class="console-header">
      <span class="console-header-title">Console / Bildirim Paneli</span>
      <div style="display:flex; gap:6px; align-items:center;">
        <span class="console-btn-icon" onclick="clearConsoleLogs()" title="Temizle">🧹 Temizle</span>
        <span class="console-btn-icon" id="consoleMinMaxBtn" onclick="toggleConsoleMinimize()" title="Aşağı/Yukarı Daralt">▼</span>
        <span class="console-btn-icon" onclick="toggleConsoleBar(false)" title="Kapat">✕</span>
      </div>
    </div>
    <div id="consoleLogs"></div>
    
    <div id="consoleInputArea">
      <span id="consoleInputLabel">Proje Adı:</span>
      <input type="text" id="consoleInput" placeholder="Yeni ismi girin...">
      <button id="consoleInputBtn" onclick="submitConsoleInput()">Tamam</button>
    </div>
  </div>

</div>

<div class="modal-overlay" id="notepadModal">
  <div class="modal-box">
    <div class="modal-header">
      <span>Proje Not Defteri</span>
      <span style="cursor:pointer;" onclick="closeNotepadModal()">✕</span>
    </div>
    <div class="modal-body">
      <textarea id="notepadTextarea" placeholder="Proje notlarınızı buraya yazabilirsiniz..."></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn-plain" style="border:1px solid #ccc;" onclick="saveNotepad()">Notları Kaydet</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="schemaModal">
  <div class="modal-box" style="width: 850px;">
    <div class="modal-header">
      <span>Yatay Ağaç Şeması (Soldan Sağa - Sürükle / Yakınlaştır)</span>
      <span style="cursor:pointer;" onclick="closeSchemaModal()">✕</span>
    </div>
    <div class="modal-body" style="padding:0;">
      <div id="schemaCanvasContainer">
        <button class="schema-reset-btn" onclick="resetCanvasTransform()">Görünümü Sıfırla</button>
        <div id="schemaViewport">
          <svg id="connectionsLayer" class="connections-layer"></svg>
          <div id="nodesLayer"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-plain" style="border:1px solid #ccc;" onclick="closeSchemaModal()">Kapat</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" style="display:none;" onchange="openFile(event)">
<input type="file" id="fileUpload" style="display:none;" onchange="uploadFile(event)">

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.14/mode/htmlmixed/htmlmixed.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

<script>
let editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "htmlmixed",
  theme: "default",
  lineNumbers: true,
  lineWrapping: true
});

let selectedProject = null;
let activeFilePath = "index.html"; 
let openTabs = ["index.html"]; 
let consoleCallback = null;

let projectData = {
  tree: {
    "index.html": { type: "file", content: "\n<div class=\"container\">\n  <h1>Onday Electronics Proje Mimarisi</h1>\n  <button id=\"btn\">Tıkla</button>\n</div>" },
    "css": {
      type: "folder",
      children: {
        "style.css": { type: "file", content: "/* Ana Stiller */" }
      }
    },
    "js": {
      type: "folder",
      children: {
        "app.js": { type: "file", content: "// Uygulama Mantığı" },
        "modules": {
          type: "folder",
          children: {
            "storage.js": { type: "file", content: "// Depolama Modülü" },
            "history.js": { type: "file", content: "// Geçmiş Modülü" }
          }
        }
      }
    }
  },
  files: {},
  notes: ""
};

function getNodeByPath(path) {
  const parts = path.split("/").filter(Boolean);
  let curr = projectData.tree;
  for (let i = 0; i < parts.length; i++) {
    if (curr[parts[i]]) {
      if (i === parts.length - 1) return curr[parts[i]];
      curr = curr[parts[i]].children;
    } else {
      return null;
    }
  }
  return null;
}

function switchTab(path) {
  if (activeFilePath) {
    const activeNode = getNodeByPath(activeFilePath);
    if (activeNode && activeNode.type === "file") {
      activeNode.content = editor.getValue();
    }
  }

  activeFilePath = path;
  if (!openTabs.includes(path)) openTabs.push(path);

  renderTabs();
  renderFileTree();

  const targetNode = getNodeByPath(path);
  if (targetNode && targetNode.type === "file") {
    if (path.endsWith(".html")) editor.setOption("mode", "htmlmixed");
    else if (path.endsWith(".css")) editor.setOption("mode", "css");
    else if (path.endsWith(".js")) editor.setOption("mode", "javascript");
    else editor.setOption("mode", "text/plain");

    editor.setValue(targetNode.content || "");
  }
}

function closeTab(path, event) {
  if (event) event.stopPropagation();
  openTabs = openTabs.filter(p => p !== path);
  
  if (activeFilePath === path) {
    if (openTabs.length > 0) {
      switchTab(openTabs[openTabs.length - 1]);
    } else {
      activeFilePath = null;
      editor.setValue("");
      renderTabs();
      renderFileTree();
    }
  } else {
    renderTabs();
  }
}

function renderTabs() {
  const container = document.getElementById("editorTabs");
  container.innerHTML = "";

  openTabs.forEach(path => {
    const tabEl = document.createElement("div");
    tabEl.className = `tab-item ${path === activeFilePath ? "active" : ""}`;
    tabEl.onclick = () => switchTab(path);

    const fileName = path.split("/").pop();
    tabEl.innerHTML = `<span>${fileName}</span><span class="tab-close" onclick="closeTab('${path}', event)">✕</span>`;
    container.appendChild(tabEl);
  });
}

function renderFileTree() {
  const container = document.getElementById("fileTreeContainer");
  container.innerHTML = "";

  function buildTreeUI(treeObj, currentPath) {
    const fragment = document.createDocumentFragment();

    for (let name in treeObj) {
      const node = treeObj[name];
      const fullPath = currentPath ? `${currentPath}/${name}` : name;

      const nodeEl = document.createElement("div");
      nodeEl.className = "tree-node";

      if (node.type === "folder") {
        const row = document.createElement("div");
        row.className = "tree-row";
        row.innerHTML = `<span>📁 <b>${name}</b></span>
          <div class="node-actions">
            <button class="node-btn" onclick="promptFolderAddChoice('${fullPath}')" title="Dosya/Klasör Ekle">+</button>
            <button class="node-btn" onclick="deleteNode('${fullPath}')" title="Klasörü Sil">✕</button>
          </div>`;

        const childrenContainer = document.createElement("div");
        childrenContainer.className = "tree-children";
        if (node.children) {
          childrenContainer.appendChild(buildTreeUI(node.children, fullPath));
        }

        nodeEl.appendChild(row);
        nodeEl.appendChild(childrenContainer);
      } else {
        const row = document.createElement("div");
        row.className = `tree-row ${fullPath === activeFilePath ? "active" : ""}`;
        row.onclick = () => switchTab(fullPath);

        let icon = "📄";
        if (name.endsWith(".css")) icon = "🎨";
        if (name.endsWith(".js")) icon = "⚡";

        row.innerHTML = `<span>${icon} ${name}</span>
          <div class="node-actions">
            <button class="node-btn" onclick="deleteNode('${fullPath}')" title="Dosyayı Sil">✕</button>
          </div>`;

        nodeEl.appendChild(row);
      }

      fragment.appendChild(nodeEl);
    }

    return fragment;
  }

  container.appendChild(buildTreeUI(projectData.tree, ""));
}

/* YATAY AĞAÇ ŞEMASI (SOLDAN SAĞA) */
let canvasScale = 1;
let canvasPanX = 40;
let canvasPanY = 40;
let isPanning = false;
let startX = 0, startY = 0;

function updateViewportTransform() {
  const vp = document.getElementById("schemaViewport");
  vp.style.transform = `translate(${canvasPanX}px, ${canvasPanY}px) scale(${canvasScale})`;
}

function resetCanvasTransform() {
  canvasScale = 1;
  canvasPanX = 40;
  canvasPanY = 40;
  updateViewportTransform();
}

function initCanvasInteractions() {
  const container = document.getElementById("schemaCanvasContainer");

  container.addEventListener("wheel", (e) => {
    e.preventDefault();
    const zoomFactor = 0.1;
    if (e.deltaY < 0) {
      canvasScale = Math.min(canvasScale + zoomFactor, 2.5);
    } else {
      canvasScale = Math.max(canvasScale - zoomFactor, 0.4);
    }
    updateViewportTransform();
  }, { passive: false });

  container.addEventListener("mousedown", (e) => {
    if (e.target.tagName === "BUTTON") return;
    isPanning = true;
    startX = e.clientX - canvasPanX;
    startY = e.clientY - canvasPanY;
  });

  window.addEventListener("mousemove", (e) => {
    if (!isPanning) return;
    canvasPanX = e.clientX - startX;
    canvasPanY = e.clientY - startY;
    updateViewportTransform();
  });

  window.addEventListener("mouseup", () => {
    isPanning = false;
  });
}

function renderCustomBlockSchema() {
  const nodesContainer = document.getElementById("nodesLayer");
  const svgContainer = document.getElementById("connectionsLayer");

  nodesContainer.innerHTML = "";
  svgContainer.innerHTML = "";

  const nodeWidth = 140;
  const nodeHeight = 32;
  const levelGapX = 200; 
  const rowGapY = 48;    

  let currentY = 20;
  let nodesList = [];

  function buildHorizontalTree(treeObj, depth = 1, parentId = "node_root") {
    for (let name in treeObj) {
      const node = treeObj[name];
      const id = "node_" + Math.random().toString(36).substr(2, 8);
      
      const nodeData = {
        id,
        name,
        type: node.type,
        parentId,
        depth,
        x: depth * levelGapX,
        y: currentY
      };

      nodesList.push(nodeData);
      currentY += rowGapY;

      if (node.type === "folder" && node.children) {
        buildHorizontalTree(node.children, depth + 1, id);
      }
    }
  }

  const rootId = "node_root";
  const rootNode = {
    id: rootId,
    name: selectedProject || "KÖK DİZİN",
    type: "root",
    parentId: null,
    depth: 0,
    x: 20,
    y: 20
  };

  nodesList.push(rootNode);
  currentY += rowGapY;

  buildHorizontalTree(projectData.tree, 1, rootId);

  let nodeMap = {};
  nodesList.forEach(n => nodeMap[n.id] = n);

  nodesList.forEach(node => {
    const nodeDiv = document.createElement("div");
    let icon = node.type === "root" ? "🚀" : (node.type === "folder" ? "📁" : "📄");
    if (node.name.endsWith(".css")) icon = "🎨";
    if (node.name.endsWith(".js")) icon = "⚡";

    nodeDiv.className = `block-node ${node.type}`;
    nodeDiv.style.left = node.x + "px";
    nodeDiv.style.top = node.y + "px";
    nodeDiv.title = node.name;
    nodeDiv.innerHTML = `<span>${icon}</span> <span style="overflow:hidden; text-overflow:ellipsis;">${node.name}</span>`;

    nodesContainer.appendChild(nodeDiv);

    if (node.parentId && nodeMap[node.parentId]) {
      const parent = nodeMap[node.parentId];

      const parentX = parent.x + nodeWidth;
      const parentY = parent.y + (nodeHeight / 2);

      const childX = node.x;
      const childY = node.y + (nodeHeight / 2);

      const midX = parentX + (childX - parentX) / 2;
      const pathData = `M ${parentX} ${parentY} L ${midX} ${parentY} L ${midX} ${childY} L ${childX} ${childY}`;

      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", pathData);
      path.setAttribute("stroke", "#007acc");
      path.setAttribute("stroke-width", "2");
      path.setAttribute("fill", "none");
      path.setAttribute("stroke-linejoin", "round");

      svgContainer.appendChild(path);
    }
  });

  resetCanvasTransform();
}

function openSchemaModal() {
  document.getElementById("schemaModal").style.display = "flex";
  renderCustomBlockSchema();
}

function closeSchemaModal() {
  document.getElementById("schemaModal").style.display = "none";
}

function toggleConsoleMinimize() {
  const consoleBar = document.getElementById("consoleBar");
  const minMaxBtn = document.getElementById("consoleMinMaxBtn");
  
  const isMin = consoleBar.classList.toggle("minimized");
  minMaxBtn.textContent = isMin ? "▲" : "▼";
  
  const logs = document.getElementById("consoleLogs");
  logs.scrollTop = logs.scrollHeight;
}

function toggleConsoleBar(open) {
  const bar = document.getElementById("consoleBar");
  const btn = document.getElementById("consoleToggleBtn");
  const isVisible = bar.style.display === "flex";
  
  if (open === true || (open === undefined && !isVisible)) {
    bar.style.display = "flex"; 
    // DÜZELTME: Otomatik çağrıldığında kullanıcının minimized (tek satır) ayarı bozulmaz!
    btn.classList.add("active");
  } else {
    bar.style.display = "none"; 
    btn.classList.remove("active");
  }
}

function logToConsole(msg, type = "info") {
  toggleConsoleBar(true);
  const logs = document.getElementById("consoleLogs");
  const line = document.createElement("div");
  line.className = "log-line";
  const timeStr = new Date().toLocaleTimeString();
  line.innerHTML = `<span class="log-time">[${timeStr}]</span> <span class="log-msg log-${type}">${msg}</span>`;
  logs.appendChild(line);
  logs.scrollTop = logs.scrollHeight;
}

function clearConsoleLogs() { document.getElementById("consoleLogs").innerHTML = ""; }

function requestConsoleInput(label, defaultValue, callback) {
  toggleConsoleBar(true);
  
  // Eğer konsol daraltılmışsa, veri girişi yapılabilmesi için geçici olarak genişlet
  const consoleBar = document.getElementById("consoleBar");
  if (consoleBar.classList.contains("minimized")) {
    consoleBar.classList.remove("minimized");
    document.getElementById("consoleMinMaxBtn").textContent = "▼";
  }

  const inputArea = document.getElementById("consoleInputArea");
  const inputEl = document.getElementById("consoleInput");
  const labelEl = document.getElementById("consoleInputLabel");
  labelEl.textContent = label;
  inputEl.value = defaultValue || "";
  inputArea.style.display = "flex";
  inputEl.focus();
  consoleCallback = callback;
}

function submitConsoleInput() {
  const inputArea = document.getElementById("consoleInputArea");
  const inputEl = document.getElementById("consoleInput");
  const val = inputEl.value.trim();
  inputArea.style.display = "none";
  if (consoleCallback) {
    const cb = consoleCallback;
    consoleCallback = null;
    cb(val);
  }
}

document.getElementById("consoleInput").addEventListener("keyup", (e) => { if (e.key === "Enter") submitConsoleInput(); });

async function getProjects() { return (await localforage.getItem("projects")) || {}; }
async function setProjects(projects) { await localforage.setItem("projects", projects); }

async function toggleSidebar(id) {
  const target = document.getElementById(id);
  const isOpen = target.style.display === "flex";
  closeSidebars();
  if (!isOpen) {
    target.style.display = "flex";
    if (id === "projectsSidebar") await renderProjectList();
    if (id === "toolsSidebar") await renderProjectFiles();
  }
}

function closeSidebars() {
  document.getElementById("projectsSidebar").style.display = "none";
  document.getElementById("toolsSidebar").style.display = "none";
}

async function renderProjectList() {
  const listEl = document.getElementById("projectList");
  listEl.innerHTML = "";
  const projects = await getProjects();
  for (let name in projects) {
    const li = document.createElement("li");
    if (name === selectedProject) li.className = "selected";
    const titleSpan = document.createElement("span");
    titleSpan.textContent = name;
    titleSpan.style.flex = "1";
    titleSpan.onclick = () => selectProject(name);
    const delBtn = document.createElement("button");
    delBtn.className = "del-proj";
    delBtn.textContent = "✕";
    delBtn.onclick = (e) => { e.stopPropagation(); deleteProject(name); };
    li.appendChild(titleSpan);
    li.appendChild(delBtn);
    listEl.appendChild(li);
  }
}

async function selectProject(name) {
  selectedProject = name;
  const projects = await getProjects();
  if (projects[name]) {
    projectData = projects[name];
    if (!projectData.tree) {
      projectData.tree = {
        "index.html": { type: "file", content: projectData.html || "" },
        "style.css": { type: "file", content: projectData.css || "" },
        "script.js": { type: "file", content: projectData.js || "" }
      };
    }
    openTabs = ["index.html"];
    switchTab("index.html");
    document.getElementById("projectTitleDisplay").textContent = name;
    document.getElementById("toolsHeaderTitle").textContent = name + " - Araçlar";
    await renderProjectFiles();
    await runCode();
    closeSidebars();
    logToConsole(`"${name}" projesi yüklendi.`, "success");
  }
}

async function saveProject() {
  if (activeFilePath) {
    const activeNode = getNodeByPath(activeFilePath);
    if (activeNode) activeNode.content = editor.getValue();
  }
  if (!selectedProject) { initSaveAsProject(); return; }
  const projects = await getProjects();
  projects[selectedProject] = projectData;
  await setProjects(projects);
  logToConsole(`"${selectedProject}" mimarisi kaydedildi.`, "success");
}

function initSaveAsProject() {
  if (activeFilePath) {
    const activeNode = getNodeByPath(activeFilePath);
    if (activeNode) activeNode.content = editor.getValue();
  }
  const defaultName = selectedProject ? selectedProject + "_kopya" : "Yeni_Proje";
  requestConsoleInput("Proje Ismi:", defaultName, async (name) => {
    if (!name) return;
    const projects = await getProjects();
    projects[name] = JSON.parse(JSON.stringify(projectData));
    await setProjects(projects);
    selectedProject = name;
    document.getElementById("projectTitleDisplay").textContent = name;
    document.getElementById("toolsHeaderTitle").textContent = name + " - Araçlar";
    await renderProjectFiles();
    logToConsole(`"${name}" projesi kaydedildi.`, "success");
  });
}

async function deleteProject(name) {
  requestConsoleInput(`"${name}" silinsin mi? (Evet/Hayır):`, "Evet", async (ans) => {
    if (ans.toLowerCase() === "evet" || ans.toLowerCase() === "e") {
      const projects = await getProjects();
      delete projects[name];
      await setProjects(projects);
      if (selectedProject === name) {
        selectedProject = null;
        document.getElementById("projectTitleDisplay").textContent = "Proje: Seçilmedi";
      }
      await renderProjectList();
      logToConsole(`"${name}" projesi silindi.`, "warn");
    }
  });
}

let saveTimeout;
editor.on("change", () => {
  if (activeFilePath) {
    const activeNode = getNodeByPath(activeFilePath);
    if (activeNode) activeNode.content = editor.getValue();
  }
  if (selectedProject) {
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(async () => {
      const projects = await getProjects();
      if (projects[selectedProject]) {
        projects[selectedProject] = projectData;
        await setProjects(projects);
      }
    }, 400);
  }
});

async function openNotepadModal() {
  if (!selectedProject) { logToConsole("Lütfen önce bir proje seçin.", "error"); return; }
  document.getElementById("notepadTextarea").value = projectData.notes || "";
  document.getElementById("notepadModal").style.display = "flex";
}
function closeNotepadModal() { document.getElementById("notepadModal").style.display = "none"; }
async function saveNotepad() {
  if (!selectedProject) return;
  projectData.notes = document.getElementById("notepadTextarea").value;
  const projects = await getProjects();
  projects[selectedProject] = projectData;
  await setProjects(projects);
  closeNotepadModal();
  logToConsole("Notlar kaydedildi.", "success");
}

const dropZone = document.getElementById("dropZone");
['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, e => { e.preventDefault(); e.stopPropagation(); }));
['dragenter', 'dragover'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.add('dragover')));
['dragleave', 'drop'].forEach(evt => dropZone.addEventListener(evt, () => dropZone.classList.remove('dragover')));

dropZone.addEventListener('drop', (e) => {
  if (e.dataTransfer.files.length > 0) handleFileUpload(e.dataTransfer.files[0]);
});

function uploadFile(event) {
  const file = event.target.files[0];
  if (file) handleFileUpload(file);
}

function handleFileUpload(file) {
  if (!selectedProject) { logToConsole("Lütfen önce bir proje seçin.", "error"); return; }
  const reader = new FileReader();
  reader.onload = async function(e) {
    if (!projectData.files) projectData.files = {};
    projectData.files[file.name] = e.target.result;
    const projects = await getProjects();
    projects[selectedProject] = projectData;
    await setProjects(projects);
    await renderProjectFiles();
    await runCode();
    logToConsole(`"${file.name}" eklendi.`, "success");
  };
  reader.readAsDataURL(file);
}

async function renderProjectFiles() {
  const container = document.getElementById("activeProjectFiles");
  container.innerHTML = "";
  if (!selectedProject) return;
  const files = projectData.files || {};
  for (let fname in files) {
    const chip = document.createElement("div");
    chip.className = "file-chip";
    chip.innerHTML = `<span>🖼️ ${fname}</span><button class="del-btn" onclick="removeFileFromProject('${fname}')">✕</button>`;
    container.appendChild(chip);
  }
}

async function removeFileFromProject(fileName) {
  if (!selectedProject) return;
  if (projectData.files && projectData.files[fileName]) {
    delete projectData.files[fileName];
    const projects = await getProjects();
    projects[selectedProject] = projectData;
    await setProjects(projects);
    await renderProjectFiles();
    await runCode();
    logToConsole(`"${fileName}" kaldırıldı.`, "warn");
  }
}

async function runCode() {
  if (activeFilePath) {
    const activeNode = getNodeByPath(activeFilePath);
    if (activeNode) activeNode.content = editor.getValue();
  }

  let mergedCSS = "";
  let mergedJS = "";
  let mainHTML = "<h1>index.html bulunamadı!</h1>";

  function traverseAndBundle(treeObj) {
    for (let name in treeObj) {
      const node = treeObj[name];
      if (node.type === "folder" && node.children) {
        traverseAndBundle(node.children);
      } else if (node.type === "file") {
        if (name.endsWith(".css")) mergedCSS += `\n/* --- ${name} --- */\n` + (node.content || "");
        else if (name.endsWith(".js")) mergedJS += `\n// --- ${name} ---\n` + (node.content || "");
        else if (name === "index.html") mainHTML = node.content || "";
      }
    }
  }

  traverseAndBundle(projectData.tree);

  const files = projectData.files;
  if (files) {
    for (let fname in files) {
      const regex = new RegExp(`(["'])${fname}\\1`, "g");
      mainHTML = mainHTML.replace(regex, `"${files[fname]}"`);
      mergedCSS = mergedCSS.replace(regex, `"${files[fname]}"`);
      mergedJS = mergedJS.replace(regex, `"${files[fname]}"`);
    }
  }

  const consoleScript = `
    <script>
      (function(){
        function sendLog(type, args){
          window.parent.postMessage({ type: 'PREVIEW_LOG', logLevel: type, msg: Array.from(args).join(' ') }, '*');
        }
        console.log = function(){ sendLog('info', arguments); };
        console.error = function(){ sendLog('error', arguments); };
        console.warn = function(){ sendLog('warn', arguments); };
        window.onerror = function(msg, url, line){ sendLog('error', [msg + ' (Satır: ' + line + ')']); };
      })();
    <\/script>
  `;

  const fullDocument = `
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8">
      ${consoleScript}
      <style>${mergedCSS}</style>
    </head>
    <body>
      ${mainHTML}
      <script>
        try { ${mergedJS} } catch(err) { console.error(err.message); }
      <\/script>
    </body>
    </html>
  `;

  document.getElementById("preview").srcdoc = fullDocument;
  logToConsole("Dinamik proje derlendi.", "info");
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === 'PREVIEW_LOG') {
    logToConsole(`[İçerik]: ${e.data.msg}`, e.data.logLevel);
  }
});

function clearCode() { editor.setValue(''); logToConsole("Kod alanı temizlendi.", "info"); }

function saveCode() {
  runCode();
  const blob = new Blob([document.getElementById("preview").srcdoc], {type:'text/html'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (selectedProject || 'index') + '.html';
  a.click();
  logToConsole("Derlenmiş HTML indirildi.", "success");
}

function promptFolderAddChoice(parentPath) {
  requestConsoleInput(`"${parentPath}" içine ne eklemek istersiniz? (1: Dosya, 2: Klasör):`, "1", (choice) => {
    if (choice === "1") promptCreateFile(parentPath);
    else if (choice === "2") promptCreateFolder(parentPath);
  });
}

function promptCreateFile(parentPath = "") {
  requestConsoleInput("Yeni Dosya Adı (Örn: utils.js):", "", (fileName) => {
    if (!fileName) return;
    let targetObj = projectData.tree;
    if (parentPath) {
      const parentNode = getNodeByPath(parentPath);
      if (parentNode && parentNode.type === "folder") {
        if (!parentNode.children) parentNode.children = {};
        targetObj = parentNode.children;
      }
    }
    if (targetObj[fileName]) { logToConsole("Bu isimde bir dosya zaten var.", "error"); return; }
    targetObj[fileName] = { type: "file", content: `// ${fileName}` };
    const newPath = parentPath ? `${parentPath}/${fileName}` : fileName;
    switchTab(newPath);
    logToConsole(`"${newPath}" dosyası oluşturuldu.`, "success");
  });
}

function promptCreateFolder(parentPath = "") {
  requestConsoleInput("Yeni Klasör Adı (Örn: components):", "", (folderName) => {
    if (!folderName) return;
    let targetObj = projectData.tree;
    if (parentPath) {
      const parentNode = getNodeByPath(parentPath);
      if (parentNode && parentNode.type === "folder") {
        if (!parentNode.children) parentNode.children = {};
        targetObj = parentNode.children;
      }
    }
    if (targetObj[folderName]) { logToConsole("Bu isimde bir klasör zaten var.", "error"); return; }
    targetObj[folderName] = { type: "folder", children: {} };
    renderFileTree();
    logToConsole(`"${folderName}" klasörü oluşturuldu.`, "success");
  });
}

function deleteNode(path) {
  requestConsoleInput(`"${path}" silinsin mi? (Evet/Hayır):`, "Evet", (ans) => {
    if (ans.toLowerCase() === "evet" || ans.toLowerCase() === "e") {
      const parts = path.split("/").filter(Boolean);
      let curr = projectData.tree;
      for (let i = 0; i < parts.length - 1; i++) curr = curr[parts[i]].children;
      delete curr[parts[parts.length - 1]];
      closeTab(path);
      renderFileTree();
      logToConsole(`"${path}" silindi.`, "warn");
    }
  });
}

function openFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    projectData.tree[file.name] = { type: "file", content: e.target.result };
    switchTab(file.name);
    runCode();
    logToConsole(`"${file.name}" eklendi.`, "info");
  };
  reader.readAsText(file);
}

  editor.setOption("theme", isDark ? "dracula" : "default");
  const logoImg = document.getElementById("siteLogo");
  logoImg.src = isDark ? "ondayelectronicslogo1.png" : "ondayelectronicslogo2.png";

  ed.style.display = ed.style.display === "none" ? "flex" : "none";
  prev.style.width = ed.style.display === "none" ? "100%" : "50%";
